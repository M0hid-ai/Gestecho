[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gestecho"
version = "0.1.0"
description = "Tap your desk. Windows responds."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gestecho = "gestecho.__main__:main"

[tool.setuptools.packages.find]
include = ["gestecho*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
